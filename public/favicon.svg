<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      :root {
        --bg-color: #1F1F21;
        --text-color: #FFFFFF;
        --border-color: rgba(255, 255, 255, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #FFFFFF;
          --text-color: #1F1F21;
          --border-color: rgba(0, 0, 0, 0.15);
        }
      }
      .bg {
        fill: var(--bg-color);
      }
      .border {
        fill: none;
        stroke: var(--border-color);
        stroke-width: 8px;
      }
      .text-cf {
        fill: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "General Sans", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
        font-weight: 800;
        font-size: 380px;
        letter-spacing: -24px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <rect class="bg" width="512" height="512" rx="108" />
  <rect class="border" x="4" y="4" width="504" height="504" rx="104" />
  <text class="text-cf" x="256" y="270">CF</text>
</svg>
